version: '3.8'

services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./logback.xml:/app/logback.xml:ro
      - gateway-logs:/app/logs
    environment:
      - JAVA_OPTS=-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -Xmx512m -Dlogback.configurationFile=/app/logback.xml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/admin/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  gateway-logs:
