apiVersion: v1
kind: Service
metadata:
  name: x-api-gateway
  labels:
    app: x-api-gateway
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: admin
      port: 9090
      targetPort: admin
      protocol: TCP
  selector:
    app: x-api-gateway
